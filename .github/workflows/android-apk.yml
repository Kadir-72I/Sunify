name: Build Sunify Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Sunify/mobile-android/**'
      - 'Sunify/src/renderer/**'
      - '.github/workflows/android-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Debug APK
        working-directory: Sunify/mobile-android
        run: gradle assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p apk-output
          cp Sunify/mobile-android/app/build/outputs/apk/debug/app-debug.apk apk-output/Sunify-Mobile-v1.2.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunify-Mobile-APK
          path: apk-output/Sunify-Mobile-v1.2.1.apk
