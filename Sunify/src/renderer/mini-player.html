<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data:; style-src 'self'; img-src 'self' https: data:; script-src 'self'; object-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunify Mini Oynatıcı</title>
    <link rel="stylesheet" href="mini-player.css" />
  </head>
  <body data-size="medium">
    <main class="mini-player" aria-label="Sunify mini oynatıcı">
      <img class="cover" id="cover" alt="Albüm kapağı" />
      <div class="track-info">
        <div class="track-title" id="title">Sunify</div>
        <div class="track-artist" id="artist">Bir şarkı seç</div>
        <button class="progress-track" id="seek-track" type="button" title="Şarkıda ilerle" aria-label="Şarkıda ilerle"><span id="progress"></span></button>
      </div>
      <div class="controls">
        <button type="button" data-action="previous" title="Önceki" aria-label="Önceki">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 6 9 12l10 6z" /></svg>
        </button>
        <button class="play" type="button" data-action="toggle" title="Çal / Duraklat" aria-label="Çal veya duraklat">
          <svg class="play-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 12 7-12 7z" /></svg>
          <svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM15 5h4v14h-4z" /></svg>
        </button>
        <button type="button" data-action="next" title="Sonraki" aria-label="Sonraki">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 6l10 6-10 6z" /></svg>
        </button>
      </div>
      <div class="time" id="time">0:00 / 0:00</div>
      <button class="close" type="button" data-action="close" title="Katmanı kapat" aria-label="Katmanı kapat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" /></svg>
      </button>
    </main>
    <script src="mini-player.js"></script>
  </body>
</html>
